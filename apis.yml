aid: amber
name: Amber Bio
description: 'Amber Bio is a San Francisco-based biotechnology company founded in 2021
  that is pioneering RNA-based gene editing. Its multi-kilobase RNA writing platform
  is designed to correct thousands of diverse mutations across a patient population
  with a single product, rather than requiring an independent therapy for each separate
  mutation. The company positions the approach as safe (minimal off-target effects),
  reversible, and capable of edits far larger than conventional base or prime editing,
  targeting previously undruggable genetic disease populations. Amber Bio launched
  publicly in August 2023 with an oversubscribed $26M seed round co-led by Playground
  Global and Andreessen Horowitz Bio + Health. It is a pre-clinical therapeutics company
  and publishes no public API, developer portal, or SDK surface.'
